name: Release Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.1.0)"
        required: true
        type: string

jobs:
  release:
    name: Build & Publish to Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Bump versionCode and versionName
        id: version
        run: |
          GRADLE_FILE="android/app/build.gradle"

          # Read current versionCode and increment it
          CURRENT_CODE=$(grep -oP 'versionCode \K[0-9]+' $GRADLE_FILE)
          NEW_CODE=$((CURRENT_CODE + 1))

          # Update versionCode
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" $GRADLE_FILE

          # Update versionName
          CURRENT_NAME=$(grep -oP 'versionName "\K[^"]+' $GRADLE_FILE)
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"${{ github.event.inputs.version_name }}\"/" $GRADLE_FILE

          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "version_name=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/org.footballproject.keystore

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.footballproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git commit -m "chore: bump android version to ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})"
          git push
