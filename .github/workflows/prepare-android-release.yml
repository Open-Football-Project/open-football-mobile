name: Prepare Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.1.0)"
        required: true
        type: string

jobs:
  prepare:
    name: Bump version and open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump versionCode and versionName
        id: version
        run: |
          GRADLE_FILE="android/app/build.gradle"

          # Read current versionCode and increment it
          CURRENT_CODE=$(grep -oP 'versionCode \K[0-9]+' $GRADLE_FILE)
          NEW_CODE=$((CURRENT_CODE + 1))

          # Update versionCode
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" $GRADLE_FILE

          # Update versionName
          CURRENT_NAME=$(grep -oP 'versionName "\K[^"]+' $GRADLE_FILE)
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"${{ github.event.inputs.version_name }}\"/" $GRADLE_FILE

          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "version_name=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/android-v${{ steps.version.outputs.version_name }}"
          git checkout -b "$BRANCH"
          git add android/app/build.gradle
          git commit -m "chore: bump android version to ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})"
          git push -u origin "$BRANCH"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "release/android-v${{ steps.version.outputs.version_name }}" \
            --title "Release Android v${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})" \
            --body "Bumps versionName to ${{ steps.version.outputs.version_name }} and versionCode to ${{ steps.version.outputs.version_code }}. Merging this PR triggers the Publish Android Release workflow, which builds and uploads the AAB to the Play Store internal track."
